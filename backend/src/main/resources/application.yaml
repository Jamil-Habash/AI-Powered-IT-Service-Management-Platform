server:
  port: 8080

spring:
  application:
    name: project

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

  datasource:
    url: jdbc:mysql://localhost:3306/smartdesk?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-20b
        temperature: 0.3

  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 50
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 30s

app:
  frontend-url: http://localhost:5173
  jwt:
    secret: 8f4a2c9e1d7b3f5a6c8e0d2b4f6a8c0e2d4f6b8a0c2e4d6f8b0a2c4e6d8f0b2a
    expiration-ms: 86400000