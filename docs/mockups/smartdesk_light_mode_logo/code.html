<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="glowGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="softShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Modern Icon Symbol (Matching Dark Mode Geometry & Proportion) -->
  <g transform="translate(10, 10)" filter="url(#softShadowLight)">
    <!-- Base geometric tech mark container for light mode -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Stylized S-desk dynamic circuit path -->
    <path d="M18 20 C18 17.79 19.79 16 22 16 H38 C40.21 16 42 17.79 42 20 V25 C42 27.21 40.21 29 38 29 H26 C23.79 29 22 30.79 22 33 V38 C22 40.21 23.79 42 26 42 H42" 
          stroke="url(#glowGradLight)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          
    <circle cx="42" cy="42" r="3.5" fill="#0284C7" />
    <circle cx="18" cy="20" r="2.5" fill="#4F46E5" />
  </g>

  <!-- Typography optimized for Light Mode -->
  <!-- Product Name: Deep Navy (#1F3864 / #0F172A) + Blue Accent (#0284C7 / #2563EB) -->
  <text x="86" y="38" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#1F3864">
    Smart<tspan fill="#0284C7">Desk</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="87" y="55" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.2" fill="#64748B">
    ITSM PLATFORM
  </text>
  
  <!-- Active / Status indicator dot -->
  <circle cx="230" cy="52" r="2.5" fill="#10B981"/>
</svg>
