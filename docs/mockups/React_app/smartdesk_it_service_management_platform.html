              <h1 class="text-2xl font-bold text-primary">Knowledge Base & Self-Service Guides</h1>
              <p class="text-xs text-on-surface-variant mt-1">Browse 450+ verified IT resolutions, software deployment procedures, and troubleshooting wikis.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              {[
                { title: "Fixing GlobalProtect VPN connection timeout", cat: "Network", reads: "1.4k reads", icon: "vpn_key" },
                { title: "Okta Multi-Factor Authentication token reset guide", cat: "Security", reads: "2.8k reads", icon: "lock_reset" },
                { title: "CalDigit TS4 Thunderbolt display firmware patch", cat: "Hardware", reads: "920 reads", icon: "devices" },
                { title: "macOS Sonoma DisplayLink driver installation", cat: "macOS", reads: "640 reads", icon: "laptop_mac" },
                { title: "Requesting software license seats via BambooHR", cat: "Licensing", reads: "3.1k reads", icon: "badge" },
                { title: "Office 365 Outlook duplicate notifications reset", cat: "Productivity", reads: "810 reads", icon: "mail" },
              ].map((kb, idx) => (
                <div key={idx} class="p-5 rounded-xl bg-surface-container-lowest shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow">
                  <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-secondary shrink-0">
                      <span class="material-symbols-outlined text-[22px]">{kb.icon}</span>
                    </div>
                    <div>
                      <span class="px-2 py-0.5 rounded bg-surface-container-high text-primary text-[10px] font-bold">{kb.cat}</span>
                      <h3 class="text-sm font-semibold text-on-surface mt-1.5">{kb.title}</h3>
                    </div>
                  </div>
                  <div class="mt-4 pt-2 border-t border-surface-container flex items-center justify-between text-xs">
                    <span class="text-on-surface-variant text-[11px]">{kb.reads}</span>
                    <button onClick={() => alert(`Opening KB article: ${kb.title}`)} class="text-secondary font-semibold hover:underline flex items-center gap-0.5">
                      <span>Read Guide</span>
                      <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </AppLayout>
      );
    }

    // ----------------------------------------------------
    // Settings Placeholder Page
    // ----------------------------------------------------
    function SettingsPage() {
      return (
        <AppLayout currentPath="/settings">
          <div class="flex flex-col w-full max-w-2xl bg-surface-container-lowest rounded-xl p-8 shadow-sm">
            <h1 class="text-xl font-bold text-primary mb-1">User & Workspace Preferences</h1>
            <p class="text-xs text-on-surface-variant mb-6">Manage profile details, notification preferences, and self-service routing configurations.</p>

            <div class="space-y-4 text-xs">
              <div>
                <label class="block font-semibold text-on-surface mb-1">Full Name</label>
                <input class="w-full p-2.5 rounded-lg bg-surface-container-low border border-outline-variant" defaultValue="Alex Morgan" />
              </div>
              <div>
                <label class="block font-semibold text-on-surface mb-1">Work Email</label>
                <input class="w-full p-2.5 rounded-lg bg-surface-container-low border border-outline-variant" defaultValue="alex.m@company.org" disabled />
              </div>
              <div>
                <label class="block font-semibold text-on-surface mb-1">Assigned Department</label>
                <input class="w-full p-2.5 rounded-lg bg-surface-container-low border border-outline-variant" defaultValue="Product & UX Design (HQ Austin)" />
              </div>
              <div class="pt-2">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" defaultChecked class="rounded text-secondary focus:ring-secondary" />
                  <span class="text-on-surface font-medium">Receive email digests for ticket SLA status changes</span>
                </label>
              </div>
              <div class="pt-4">
                <button onClick={() => alert("Settings preferences saved.")} class="px-5 py-2.5 bg-primary text-on-primary rounded-lg font-semibold hover:bg-primary/90">
                  Save Changes
                </button>
              </div>
            </div>
          </div>
        </AppLayout>
      );
    }

    // ----------------------------------------------------
    // Main App Component with Router
    // ----------------------------------------------------
    function App() {
      return (
        <MemoryRouter initialEntries={["/dashboard"]}>
          <Routes>
            <Route path="/" element={<LoginPage />} />
            <Route path="/login" element={<LoginPage />} />
            <Route path="/register" element={<RegisterPage />} />
            <Route path="/dashboard" element={<DashboardPage />} />
            <Route path="/create-ticket" element={<CreateTicketPage />} />
            <Route path="/tickets" element={<TicketsQueuePage />} />
            <Route path="/ticket/:id" element={<TicketDetailPage />} />
            <Route path="/analytics" element={<AnalyticsPage />} />
            <Route path="/knowledge-base" element={<KnowledgeBasePage />} />
            <Route path="/settings" element={<SettingsPage />} />
          </Routes>
        </MemoryRouter>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
